name: Captar Lello
on:
  workflow_dispatch:
    inputs:
      condominio:
        description: Condomínio da Lello
        type: choice
        default: Safira
        options:
          - Safira
          - Bosque Marajoara
          - Solar dos Bandeirantes
          - Tour de Lion
          - Inspire Mauá Sonhos
          - Follow – The Eureka Building
          - Harmonia Morumbi
          - Co.Next Liberdade
          - VN Casa Topázio

permissions:
  contents: read

concurrency:
  group: captar-lello

jobs:
  captar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: node captacao/executar.mjs "$LELLO_CONDOMINIO"
        env:
          LELLO_CONDOMINIO: ${{ inputs.condominio }}
          AGENTE_LELLO_USUARIO: ${{ secrets.AGENTE_LELLO_USUARIO }}
          AGENTE_LELLO_SENHA: ${{ secrets.AGENTE_LELLO_SENHA }}
          AGENTE_LELLO_TOPAZIO_USUARIO: ${{ secrets.AGENTE_LELLO_TOPAZIO_USUARIO }}
          AGENTE_LELLO_TOPAZIO_SENHA: ${{ secrets.AGENTE_LELLO_TOPAZIO_SENHA }}
          AGENTE_LELLO_CONEXT_USUARIO: ${{ secrets.AGENTE_LELLO_CONEXT_USUARIO }}
          AGENTE_LELLO_CONEXT_SENHA: ${{ secrets.AGENTE_LELLO_CONEXT_SENHA }}
          AGENTE_LELLO_SAFIRA_USUARIO: ${{ secrets.AGENTE_LELLO_SAFIRA_USUARIO }}
          AGENTE_LELLO_SAFIRA_SENHA: ${{ secrets.AGENTE_LELLO_SAFIRA_SENHA }}
          ESPELHO_DATABASE_URL: ${{ secrets.ESPELHO_DATABASE_URL }}
