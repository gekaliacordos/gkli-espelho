name: Captar Lello
on:
  workflow_dispatch:
    inputs:
      condominio:
        description: Condomínio da Lello
        type: choice
        default: Safira
        options:
          - Todos
          - Safira
          - Bosque Marajoara
          - Solar dos Bandeirantes
          - Tour de Lion
          - Inspire Mauá Sonhos
          - Follow – The Eureka Building
          - Harmonia Morumbi
          - Co.Next Liberdade
          - VN Casa Topázio
          - Villa Natura

permissions:
  contents: read

concurrency:
  group: captar-lello

jobs:
  captar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Captar e gravar no Supabase
        run: |
          if [ "$LELLO_CONDOMINIO" = "Todos" ]; then LELLO_CONDOMINIO=""; fi
          node captacao/executar-nuvem.mjs lello "$LELLO_CONDOMINIO"
        env:
          LELLO_CONDOMINIO: ${{ inputs.condominio }}
          ESPELHO_DATABASE_URL: ${{ secrets.ESPELHO_COLETORES_DATABASE_URL }}
          ESPELHO_PORTAIS_B64: ${{ secrets.ESPELHO_PORTAIS_V2 }}
