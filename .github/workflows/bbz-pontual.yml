name: Conferência pontual BBZ
on:
  push:
    branches: [codex/bbz-recibos-pontuais]
permissions:
  contents: read
concurrency:
  group: captar-portal-bbz
jobs:
  consultar:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        alvo: [bbz-1158, bbz-1207, bbz-1220, bbz-1341, bbz-1532, bbz-1679, bbz-1680, bbz-1681, bbz-1682, bbz-1683, bbz-1792, bbz-1837, bbz-1838, bbz-1839, bbz-1841, bbz-1842, bbz-1843, bbz-1844, bbz-1880, bbz-650, bbz-728, bbz-820]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: node captacao/bbz-pontual.mjs "$ALVO"
        env:
          ALVO: ${{ matrix.alvo }}
          ESPELHO_PORTAIS_B64: ${{ secrets.ESPELHO_PORTAIS_V2 }}
          PUBLIC_RESULT_KEY: 
