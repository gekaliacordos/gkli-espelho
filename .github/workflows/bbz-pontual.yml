name: Atualização pontual Hi View residencial
on:
  push:
    branches: [codex/bbz-recibos-pontuais]
permissions:
  contents: read
concurrency:
  group: captar-portal-bbz
jobs:
  consultar:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        alvo: [bbz-1869]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: node captacao/executar-nuvem.mjs bbz "$ALVO"
        env:
          ALVO: ${{ matrix.alvo }}
          ESPELHO_PORTAIS_B64: ${{ secrets.ESPELHO_PORTAIS_V2 }}
          ESPELHO_DATABASE_URL: ${{ secrets.ESPELHO_COLETORES_DATABASE_URL }}
