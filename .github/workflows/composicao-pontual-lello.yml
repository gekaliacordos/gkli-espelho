name: Conferência das fichas pendentes no Acob
on:
  push:
    branches: [codex/composicao-pontual-lello-20261126]
permissions:
  contents: read
concurrency:
  group: captar-portal-lello
jobs:
  consultar:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - codigo: "63004"
            intervalo: "0,26,27,35,36"
          - codigo: "63004"
            intervalo: "48,49,50,53,54"
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: node captacao/lello-composicao-reconsulta.mjs "$CODIGO" "$INTERVALO"
        env:
          CODIGO: ${{ matrix.codigo }}
          INTERVALO: ${{ matrix.intervalo }}
          ESPELHO_DATABASE_URL: ${{ secrets.ESPELHO_COLETORES_DATABASE_URL }}
          ESPELHO_PORTAIS_B64: ${{ secrets.ESPELHO_PORTAIS_V2 }}
          PUBLIC_RESULT_KEY: 
