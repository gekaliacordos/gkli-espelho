<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | GKLI Espelho</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      font: 1rem system-ui, sans-serif; background: #f3f5f8; color: #172337; }
    main { width: min(100%, 45rem); padding: 2rem; border: 1px solid #d5dce6;
      border-radius: 1rem; background: white; }
    h1 { margin: 0 0 1.5rem; font-size: 1.75rem; }
    form:not([hidden]) { display: grid; gap: .6rem; }
    input, button { font: inherit; padding: .7rem .85rem; border-radius: .45rem; }
    input { width: 100%; border: 1px solid #8190a4; margin: 0 0 .5rem; }
    select { display: block; margin: .4rem 0 1rem; max-width: 100%; font: inherit; padding: .5rem; }
    button { border: 0; background: #244a80; color: white; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { color: #9b2525; }
    #status:empty { margin: 0; }
    #account { overflow-wrap: anywhere; }
    #result, #catalog { margin-top: 1.5rem; }
    details { border-top: 1px solid #d5dce6; padding: .7rem 0; }
    summary { cursor: pointer; }
    li { margin: .4rem 0; overflow-wrap: anywhere; }
    #unit-filter, #catalog-filter { margin: .4rem 0 1rem; }
    .catalog-record { display: grid; gap: .35rem .8rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
    .catalog-record dt { font-weight: 600; overflow-wrap: anywhere; }
    .catalog-record dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    #simulador { margin-top: 1.5rem; }
    #simulador fieldset { border: 1px solid #d5dce6; border-radius: .45rem; margin: 0; min-width: 0; }
    #simulador label:has(input) { display: flex; align-items: baseline; gap: .45rem; }
    #simulador input[type="checkbox"] { width: auto; margin: .35rem 0; }
    #simulacao-revisao:not(:empty) { border-top: 1px solid #d5dce6; margin-top: 1rem; }
    .access-details { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>GKLI Espelho</h1>
    <form id="login" method="post">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="enter" type="submit" disabled>Entrar</button>
    </form>
    <section id="signed-in" hidden>
      <p id="account"></p>
      <button id="exit" type="button">Sair</button>
      <details id="simulador" hidden>
        <summary>Simular acordo</summary>
        <form id="simulacao-form">
          <label for="simulacao-adm">Administradora</label>
          <select id="simulacao-adm" required></select>
          <label for="simulacao-condominio">Condomínio</label>
          <select id="simulacao-condominio" required disabled></select>
          <p id="simulacao-status" role="status" hidden></p>
          <label for="simulacao-unidade">Unidade</label>
          <select id="simulacao-unidade" required disabled></select>
          <fieldset id="simulacao-cotas" hidden>
            <legend>Cotas em aberto</legend>
            <div></div>
          </fieldset>
          <fieldset id="simulacao-condicoes" disabled>
            <legend>Condições</legend>
            <label for="simulacao-despesa">Despesa de cobrança</label>
            <select id="simulacao-despesa"><option value="10">10%</option><option value="20">20%</option></select>
            <label for="simulacao-parcelas">Parcelas</label>
            <select id="simulacao-parcelas"><option value="1">1x à vista</option><option value="2">2x</option><option value="3">3x</option></select>
            <label><input type="checkbox" id="simulacao-juros" disabled> Juros de 1% ao mês (Price)</label>
            <label><input type="checkbox" id="simulacao-boleto"> <span id="simulacao-boleto-texto">Cobrar boleto</span></label>
          </fieldset>
          <button id="simulacao-gerar" type="submit" disabled>Gerar simulação</button>
        </form>
        <section id="simulacao-revisao" aria-live="polite"></section>
      </details>
      <div id="result" aria-live="polite"></div>
      <section id="catalog"></section>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script type="module">
    import { agruparCotas, calcularSimulacao, hojeEmSaoPaulo, localizarCadastro, somarDias } from "./simulacao.mjs";
    const authUrl = "https://jrctpldzavctwaqiepul.supabase.co/auth/v1";
    const apiKey = "sb_publishable_TrF0lI26AdHZ1ksG650lPA_N6JrTYCz";
    const login = document.querySelector("#login");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const enter = document.querySelector("#enter");
    const exit = document.querySelector("#exit");
    const signedIn = document.querySelector("#signed-in");
    const account = document.querySelector("#account");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const catalog = document.querySelector("#catalog");
    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const dataCurta = iso => iso.split("-").reverse().join("/");
    const dataHora = new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });
    let accessToken;

    function listar(destino, titulo, linhas) {
      const detalhes = document.createElement("details");
      const rotulo = document.createElement("summary");
      rotulo.textContent = titulo + " (" + linhas.length + ")";
      detalhes.append(rotulo);
      if (linhas.length) {
        const lista = document.createElement("ul");
        for (const linha of linhas) {
          const item = document.createElement("li");
          item.textContent = linha;
          lista.append(item);
        }
        detalhes.append(lista);
      }
      destino.append(detalhes);
    }

    const rotulosAcesso = {
      cadastrado: "Acesso cadastrado",
      sem_acesso: "Sem acesso",
      nao_verificado: "Não verificado",
    };

    function montarAcesso(id, acesso, ficha, token) {
      const bloco = document.createElement("div");
      const situacao = document.createElement("p");
      situacao.textContent = "Acesso ao portal · " + (rotulosAcesso[acesso?.situacao] ?? "Não verificado");
      bloco.append(situacao);

      if (acesso?.administradora) {
        const adm = document.createElement("p");
        adm.textContent = "Administradora na planilha · " + acesso.administradora;
        bloco.append(adm);
      }

      if (acesso?.portal) {
        const portal = document.createElement("p");
        portal.textContent = "Portal · ";
        let url;
        try { url = new URL(acesso.portal); } catch {}
        if (url && ["https:", "http:"].includes(url.protocol) && !url.username && !url.password) {
          const link = document.createElement("a");
          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = url.hostname;
          portal.append(link);
        } else {
          portal.append(acesso.portal);
        }
        bloco.append(portal);
      }

      if (acesso?.situacao === "cadastrado") {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.textContent = "Mostrar dados de acesso";
        const dados = document.createElement("p");
        dados.className = "access-details";
        dados.setAttribute("role", "status");
        let exibindo = false;
        const ocultar = () => {
          exibindo = false;
          dados.textContent = "";
          botao.textContent = "Mostrar dados de acesso";
        };
        ficha.addEventListener("toggle", () => { if (!ficha.open) ocultar(); });
        botao.addEventListener("click", async () => {
          if (exibindo) {
            ocultar();
            return;
          }
          botao.disabled = true;
          dados.textContent = "Consultando…";
          try {
            const params = new URLSearchParams({ select: "credenciais", condominio_id: "eq." + id });
            const response = await fetch(new URL("/rest/v1/condominio_acessos?" + params, authUrl), {
              headers: { apikey: apiKey, Authorization: "Bearer " + token },
              cache: "no-store",
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error("Consulta indisponível");
            const [registro] = await response.json();
            if (token !== accessToken || !ficha.open || ficha.hidden) {
              ocultar();
              return;
            }
            dados.textContent = registro?.credenciais || "Dados de acesso indisponíveis.";
            exibindo = true;
            botao.textContent = "Ocultar dados de acesso";
          } catch {
            if (token === accessToken && ficha.open && !ficha.hidden) dados.textContent = "Não foi possível consultar os dados de acesso.";
          } finally {
            botao.disabled = false;
          }
        });
        bloco.append(botao, dados);
      }
      return bloco;
    }

    async function consultarEspelho(token, tabela, filtros) {
      const query = new URLSearchParams(filtros);
      const response = await fetch(new URL("/rest/v1/" + tabela + "?" + query, authUrl), {
        headers: { apikey: apiKey, Authorization: "Bearer " + token },
        cache: "no-store",
        signal: AbortSignal.timeout(15000),
      });
      if (!response.ok) throw new Error("Consulta indisponível");
      return response.json();
    }

    function consultarCaptacao(token, codigo, administradora) {
      return consultarEspelho(token, "captacoes", {
        select: "condominio,administradora,captado_em,dados",
        codigo_condominio: "eq." + codigo,
        ...(administradora ? { administradora: "eq." + administradora } : {}),
        order: "captado_em.desc",
        limit: "1",
      });
    }

    const simulador = document.querySelector("#simulador");
    const formulario = document.querySelector("#simulacao-form");
    const admSim = document.querySelector("#simulacao-adm");
    const condominioSim = document.querySelector("#simulacao-condominio");
    const unidadeSim = document.querySelector("#simulacao-unidade");
    const cotasSim = document.querySelector("#simulacao-cotas");
    const condicoesSim = document.querySelector("#simulacao-condicoes");
    const listaCotas = cotasSim.querySelector("div");
    const despesaSim = document.querySelector("#simulacao-despesa");
    const parcelasSim = document.querySelector("#simulacao-parcelas");
    const jurosSim = document.querySelector("#simulacao-juros");
    const boletoSim = document.querySelector("#simulacao-boleto");
    const boletoTexto = document.querySelector("#simulacao-boleto-texto");
    const gerarSim = document.querySelector("#simulacao-gerar");
    const revisaoSim = document.querySelector("#simulacao-revisao");
    const statusSim = document.querySelector("#simulacao-status");
    const formatarCentavos = valor => moeda.format(valor / 100);

    function preencherOpcoes(select, itens) {
      select.replaceChildren(new Option("Selecione", ""), ...itens.map(([valor, texto]) => new Option(texto, valor)));
      select.disabled = !itens.length;
    }

    function mostrarStatusSim(texto) {
      statusSim.textContent = texto;
      statusSim.hidden = !texto;
    }

    function limparUnidadeSim() {
      cotasSim.hidden = true;
      condicoesSim.disabled = true;
      listaCotas.replaceChildren();
      revisaoSim.replaceChildren();
      gerarSim.disabled = true;
    }

    function limparSimulador() {
      simulador.hidden = true;
      simulador.open = false;
      formulario.reset();
      for (const seletor of [admSim, condominioSim, unidadeSim]) preencherOpcoes(seletor, []);
      admSim.onchange = condominioSim.onchange = unidadeSim.onchange = formulario.onsubmit = null;
      mostrarStatusSim("");
      limparUnidadeSim();
    }

    async function prepararSimulador(token, consultaCaptacoes, consultaCadastro) {
      try {
        const [captacoes, registros] = await Promise.all([consultaCaptacoes, consultaCadastro]);
        if (token !== accessToken) return;
        simulador.hidden = false;
        const administradoras = [...new Set(captacoes.map(captacao => captacao.administradora).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "pt-BR"));
        preencherOpcoes(admSim, administradoras.map(adm => [adm, adm]));
        if (!administradoras.length) mostrarStatusSim("Nenhuma captação disponível para simular.");

        let unidades = new Map();
        let custoBoleto = null;
        let consultaAtual = 0;
        const limparCondominio = () => {
          consultaAtual++;
          unidades = new Map();
          custoBoleto = null;
          boletoSim.checked = false;
          preencherOpcoes(unidadeSim, []);
          mostrarStatusSim("");
          limparUnidadeSim();
        };

        admSim.onchange = () => {
          limparCondominio();
          preencherOpcoes(condominioSim, captacoes.filter(captacao => captacao.administradora === admSim.value)
            .map(captacao => [captacao.codigo_condominio, captacao.condominio]));
        };

        condominioSim.onchange = async () => {
          limparCondominio();
          const codigo = condominioSim.value;
          const administradora = admSim.value;
          const captacao = captacoes.find(item => item.codigo_condominio === codigo && item.administradora === administradora);
          if (!captacao) return;
          const cadastro = localizarCadastro(captacao, registros);
          if (!cadastro) {
            mostrarStatusSim("O cadastro do condomínio não foi identificado para conferir a régua e o custo de boleto.");
            return;
          }
          const diasRegua = Number(cadastro.dias_apos_vencimento_regua ?? cadastro.inicio_cobranca_dias ?? 30);
          if (!Number.isSafeInteger(diasRegua) || diasRegua < 0) {
            mostrarStatusSim("Confira a régua no cadastro do condomínio.");
            return;
          }
          const custo = Number(cadastro.custo_emissao_boleto);
          custoBoleto = cadastro.custo_emissao_boleto != null && cadastro.custo_emissao_boleto !== ""
            && Number.isFinite(custo) && custo >= 0 ? Math.round(custo * 100) : null;
          boletoSim.disabled = custoBoleto === null;
          boletoTexto.textContent = custoBoleto === null ? "Cobrar boleto (custo indisponível no cadastro)"
            : "Cobrar boleto (" + formatarCentavos(custoBoleto) + " por emissão)";

          const consulta = consultaAtual;
          mostrarStatusSim("Consultando as cotas da última captação…");
          try {
            const [resultado] = await consultarCaptacao(token, codigo, administradora);
            if (token !== accessToken || consulta !== consultaAtual) return;
            if (!resultado) throw new Error("Captação indisponível");
            unidades = agruparCotas(resultado.dados, hojeEmSaoPaulo(), diasRegua);
            preencherOpcoes(unidadeSim, [...unidades.keys()].map(unidade => [unidade, unidade]));
            const mensagem = unidades.size ? "Cotas captadas em " + dataHora.format(new Date(resultado.captado_em)) + "."
              : "Nenhuma unidade com cotas abertas dentro da régua nesta captação.";
            mostrarStatusSim(mensagem);
          } catch {
            if (token === accessToken && consulta === consultaAtual) mostrarStatusSim("Não foi possível carregar as cotas. Selecione o condomínio novamente.");
          }
        };

        unidadeSim.onchange = () => {
          limparUnidadeSim();
          const cotas = unidades.get(unidadeSim.value) ?? [];
          cotas.forEach((cota, indice) => {
            const caixa = document.createElement("input");
            caixa.type = "checkbox";
            caixa.value = String(indice);
            caixa.checked = !cota.regular;
            const rotulo = document.createElement("label");
            rotulo.append(caixa, [
              "Recibo " + cota.recibo, dataCurta(cota.vencimento),
              cota.regular ? "Regular" : "Dentro da régua", formatarCentavos(cota.valor),
            ].join(" · "));
            listaCotas.append(rotulo);
          });
          cotasSim.hidden = !cotas.length;
          condicoesSim.disabled = !cotas.length;
          gerarSim.disabled = !cotas.length;
        };

        formulario.onsubmit = evento => {
          evento.preventDefault();
          const cotas = unidades.get(unidadeSim.value) ?? [];
          const escolhidas = [...listaCotas.querySelectorAll("input:checked")].map(caixa => cotas[Number(caixa.value)]);
          if (!escolhidas.length) return;
          const percentual = Number(despesaSim.value);
          const previa = calcularSimulacao({
            cotas: escolhidas, percentual, quantidade: Number(parcelasSim.value), price: jurosSim.checked,
            boleto: boletoSim.checked ? custoBoleto ?? 0 : 0, primeiroVencimento: somarDias(hojeEmSaoPaulo(), 7),
          });
          const titulo = document.createElement("h2");
          titulo.textContent = "Confira a simulação";
          const valores = document.createElement("dl");
          valores.className = "catalog-record";
          for (const [nome, valor] of [
            ["Cotas selecionadas", previa.base], ["Despesa de cobrança (" + percentual + "%)", previa.despesa],
            ["Juros do parcelamento", previa.juros], ["Emissão de boletos", previa.boletos], ["Total", previa.total],
          ]) {
            const termo = document.createElement("dt");
            const detalhe = document.createElement("dd");
            termo.textContent = nome;
            detalhe.textContent = formatarCentavos(valor);
            valores.append(termo, detalhe);
          }
          const plano = document.createElement("ol");
          previa.parcelas.forEach(parcela => {
            const item = document.createElement("li");
            item.textContent = dataCurta(parcela.vencimento) + " · " + formatarCentavos(parcela.valor);
            plano.append(item);
          });
          revisaoSim.replaceChildren(titulo, valores, plano);
        };
      } catch {
        if (token !== accessToken) return;
        simulador.hidden = false;
        mostrarStatusSim("Não foi possível carregar as captações e o cadastro para simular.");
      }
    }

    formulario.addEventListener("change", () => {
      revisaoSim.replaceChildren();
      jurosSim.disabled = parcelasSim.value === "1";
      gerarSim.disabled = !listaCotas.querySelector("input:checked");
    });

    async function mostrarCadastro(token, consulta) {
      catalog.textContent = "Consultando o cadastro de condomínios…";
      try {
        const registros = await consulta;
        if (token !== accessToken) return;

        const titulo = document.createElement("h2");
        titulo.textContent = "Cadastro de condomínios";
        const rotulo = document.createElement("label");
        rotulo.htmlFor = "catalog-filter";
        rotulo.textContent = "Buscar por nome, CNPJ, administradora ou status";
        const filtro = document.createElement("input");
        filtro.type = "search";
        filtro.id = "catalog-filter";
        const contagem = document.createElement("p");
        contagem.setAttribute("role", "status");
        const lista = document.createElement("div");
        catalog.replaceChildren(titulo, rotulo, filtro, contagem, lista);

        const normalizar = texto => texto.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim();
        for (const { id, nome, administradora, status, cadastro, condominio_acessos: acesso } of registros) {
          const ficha = document.createElement("details");
          const resumo = document.createElement("summary");
          resumo.textContent = [nome, administradora, status, rotulosAcesso[acesso?.situacao] ?? "Não verificado"].filter(Boolean).join(" · ");
          ficha.append(resumo);
          ficha.addEventListener("toggle", () => {
            if (!ficha.open || ficha.querySelector("dl")) return;
            const campos = document.createElement("dl");
            campos.className = "catalog-record";
            const principais = ["nome", "nome_operacional", "cnpj", "administradora", "status"];
            const chaves = [...principais, ...Object.keys(cadastro).filter(chave => !principais.includes(chave)).sort()];
            for (const chave of chaves) {
              const termo = document.createElement("dt");
              termo.textContent = chave === "cnpj" ? "CNPJ" : chave.replaceAll("_", " ");
              const valor = document.createElement("dd");
              valor.textContent = cadastro[chave] || "—";
              campos.append(termo, valor);
            }
            ficha.append(montarAcesso(id, acesso, ficha, token), campos);
          });
          const cnpj = cadastro.cnpj ?? "";
          ficha.dataset.status = normalizar(status ?? "");

          ficha.dataset.busca = normalizar([nome, cadastro.nome_operacional, administradora, cnpj, cnpj.replace(/\D/g, ""), status].join(" "));
          lista.append(ficha);
        }

        function filtrarCadastro() {
          const busca = normalizar(filtro.value);
          let total = 0;
          for (const ficha of lista.children) {
            ficha.hidden = ["ativo", "inativo"].includes(busca)
              ? ficha.dataset.status !== busca
              : !ficha.dataset.busca.includes(busca);
            if (ficha.hidden) ficha.open = false;
            else total++;
          }
          contagem.textContent = total + " de " + registros.length + " condomínios";
        }

        filtro.addEventListener("input", filtrarCadastro);
        filtrarCadastro();
      } catch {
        if (token === accessToken) catalog.textContent = "Não foi possível consultar o cadastro.";
      }
    }

    async function mostrarSelecaoCaptacao(token, consulta) {
      result.textContent = "Consultando captações…";
      try {
        const captacoes = await consulta;
        if (token !== accessToken) return;
        if (!captacoes.length) {
          result.textContent = "Nenhuma captação disponível para esta conta.";
          return;
        }
        const titulo = document.createElement("h2");
        titulo.textContent = "Captações por condomínio";
        const label = document.createElement("label");
        label.htmlFor = "capture-select";
        label.textContent = "Condomínio captado";
        const seletor = document.createElement("select");
        seletor.id = "capture-select";
        for (const captacao of captacoes) {
          const opcao = document.createElement("option");
          opcao.value = captacao.codigo_condominio;
          opcao.textContent = captacao.condominio + " · " + captacao.administradora;
          seletor.append(opcao);
        }
        if (captacoes.some(captacao => captacao.codigo_condominio === "63004")) seletor.value = "63004";
        const painel = document.createElement("div");
        result.replaceChildren(titulo, label, seletor, painel);
        const mostrar = () => {
          const codigo = seletor.value;
          void mostrarCaptacao(token, codigo, painel, () => seletor.value === codigo);
        };
        seletor.addEventListener("change", mostrar);
        mostrar();
      } catch {
        if (token === accessToken) result.textContent = "Não foi possível consultar as captações.";
      }
    }

    async function mostrarCaptacao(token, codigo, painel, continuaSelecionado) {
      painel.textContent = "Consultando a captação…";
      try {
        const [captacao] = await consultarCaptacao(token, codigo);
        if (token !== accessToken || !continuaSelecionado()) return;
        if (!captacao) {
          painel.textContent = "Nenhuma captação disponível para esta conta.";
          return;
        }
        const { condominio, administradora, captado_em, dados } = captacao;
        painel.textContent = "";
        const titulo = document.createElement("h2");
        titulo.textContent = administradora + " · " + condominio;
        const data = document.createElement("p");
        data.textContent = "Captado em " + dataHora.format(new Date(captado_em));
        const rotulo = document.createElement("label");
        rotulo.htmlFor = "unit-filter";
        rotulo.textContent = "Filtrar por unidade";
        const filtro = document.createElement("input");
        filtro.id = "unit-filter";
        filtro.type = "search";
        const listas = document.createElement("div");
        painel.append(titulo, data);
        if (dados.cobertura) {
          const cobertura = document.createElement("p");
          cobertura.textContent = dados.cobertura;
          painel.append(cobertura);
        }
        if (dados.acordosCaptadosEm) {
          const atualizacao = document.createElement("p");
          atualizacao.textContent = "Acordos captados em " + dataHora.format(new Date(dados.acordosCaptadosEm));
          painel.append(atualizacao);
        }
        painel.append(rotulo, filtro, listas);

        function mostrarListas() {
          const busca = filtro.value.trim().toUpperCase();
          const corresponde = unidade => unidade.toUpperCase().includes(busca);
          listas.replaceChildren();
          listar(listas, dados.unidadesDoFiltro ? "Unidades no portal" : dados.cobertura ? "Unidades no relatório" : "Unidades identificadas", dados.unidades.filter(corresponde).sort());
          if (!dados.cobertura || dados.contatos.length) listar(listas, "Responsáveis encontrados", dados.contatos.filter(c => corresponde(c.unidade)).map(c =>
            [c.unidade, c.nome, c.email].filter(Boolean).join(" · ")
          ));
          const tituloCotas = dados.cotasEmAcordoNoRelatorio ? "Recibos no relatório de devedores" : "Cotas em aberto";
          const situacoesAcordos = new Map(dados.acordos.map(a => [a.numero, a.situacao]));
          listar(listas, tituloCotas, dados.cotas.filter(c => corresponde(c.unidade)).map(c => [
            c.unidade, "Recibo " + c.recibo, c.vencimento, moeda.format(c.valores.at(-1) / 100),
            c.acordoOrigem ? "Acordo " + c.acordoOrigem : null, situacoesAcordos.get(c.acordoOrigem),
          ].filter(Boolean).join(" · ")));
          if (!dados.cobertura || dados.acordosCaptadosEm) listar(listas, "Acordos", dados.acordos.filter(a => corresponde(a.unidade)).map(a => [
            a.unidade, "Acordo " + a.numero, a.situacao, a.total == null ? null : moeda.format(a.total / 100),
            a.parcelas ? a.parcelas.length + " parcelas" : null, a.cotas ? a.cotas.length + " cotas vinculadas" : null,
            a.saldo == null ? null : "Saldo " + moeda.format(a.saldo / 100),
            a.periodoNegociado ? "Período negociado " + dataCurta(a.periodoNegociado.inicio) + " a " + dataCurta(a.periodoNegociado.fim) : null,
            a.cotasAbertasNoPeriodo?.length ? "Recibos em aberto no período (a conferir) " + a.cotasAbertasNoPeriodo.map(cota => cota.recibo).join(", ") : null,
          ].filter(Boolean).join(" · ")));
        }

        filtro.addEventListener("input", mostrarListas);
        mostrarListas();
      } catch {
        if (token === accessToken && continuaSelecionado()) painel.textContent = "Não foi possível consultar a captação.";
      }
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      enter.disabled = true;
      status.textContent = "";
      try {
        const response = await fetch(authUrl + "/token?grant_type=password", {
          method: "POST",
          headers: { apikey: apiKey, "Content-Type": "application/json" },
          body: JSON.stringify({ email: email.value.trim(), password: password.value }),
          signal: AbortSignal.timeout(15000),
        });
        if (!response.ok) {
          status.textContent = response.status === 429
            ? "Muitas tentativas. Aguarde um pouco e tente novamente."
            : response.status === 400
              ? "Confira o e-mail e a senha. A conta precisa estar confirmada."
              : "O login está indisponível. Tente novamente.";
          return;
        }
        const session = await response.json();
        accessToken = session.access_token;
        account.textContent = "Sessão iniciada como " + session.user.email + ".";
        login.hidden = true;
        signedIn.hidden = false;
        exit.focus();
        const captacoes = consultarEspelho(accessToken, "captacoes_recentes", {
          select: "codigo_condominio,condominio,administradora", order: "condominio.asc,codigo_condominio.asc",
        });
        const cadastro = consultarEspelho(accessToken, "condominios", {
          select: "id,nome,administradora,status,cadastro,condominio_acessos(situacao,administradora,portal)", order: "nome.asc,id.asc",
        });
        void mostrarSelecaoCaptacao(accessToken, captacoes);
        void mostrarCadastro(accessToken, cadastro);
        void prepararSimulador(accessToken, captacoes, cadastro);
      } catch {
        status.textContent = "Não foi possível conectar. Tente novamente.";
      } finally {
        password.value = "";
        enter.disabled = false;
      }
    });

    exit.addEventListener("click", async () => {
      exit.disabled = true;
      status.textContent = "";
      try {
        const response = await fetch(authUrl + "/logout?scope=local", {
          method: "POST",
          headers: { apikey: apiKey, Authorization: "Bearer " + accessToken },
          signal: AbortSignal.timeout(10000),
        });
        if (!response.ok && response.status !== 401) {
          throw new Error("Logout failed");
        }
      } catch {
        status.textContent = "Sessão encerrada nesta página. O servidor não confirmou a saída.";
      } finally {
        accessToken = undefined;
        account.textContent = "";
        result.textContent = "";
        limparSimulador();
        catalog.textContent = "";
        signedIn.hidden = true;
        login.hidden = false;
        exit.disabled = false;
        email.focus();
      }
    });

    enter.disabled = false;
  </script>
</body>
</html>
