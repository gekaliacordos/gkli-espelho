<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | GKLI Espelho</title>
  <link rel="stylesheet" href="./espelho.css">
</head>
<body>
  <main>
    <header class="marca">
      <img src="./assets/gkli-marca.webp" alt="GKLI — Cobrança inteligente" width="145">
      <span>Espelho</span>
    </header>
    <section class="entrada">
      <div class="entrada-conteudo">
        <h1>GKLI Espelho</h1>
        <p>Acesse o cadastro de condomínios, confira captações e simule acordos.</p>
        <form id="login" method="post">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
          <label for="password">Senha</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="enter" type="submit" disabled>Entrar <span aria-hidden="true">→</span></button>
        </form>
        <p id="status" role="status"></p>
      </div>
      <div class="entrada-foto" aria-hidden="true"></div>
    </section>
    <section id="signed-in" hidden>
      <div class="session-header">
        <p id="account"></p>
        <button id="exit" type="button">Sair</button>
      </div>
      <header class="inicio-hero">
        <h1>GKLI Espelho</h1>
      </header>
      <nav id="inicio" class="home-cards" aria-label="Áreas do GKLI Espelho">
        <button type="button" class="home-card" data-area="cadastro-area" aria-controls="cadastro-area">
          <span class="card-icone card-icone-cadastro" aria-hidden="true"></span>
          <strong>Cadastro</strong><span>Consulte condomínios e acessos.</span>
        </button>
        <button type="button" class="home-card" data-area="captacao-area" aria-controls="captacao-area">
          <span class="card-icone card-icone-captacao" aria-hidden="true"></span>
          <strong>Captação</strong><span>Confira cotas e acordos captados.</span>
        </button>
        <button type="button" class="home-card" data-area="acordo-area" aria-controls="acordo-area">
          <span class="card-icone card-icone-acordo" aria-hidden="true"></span>
          <strong>Acordo</strong><span>Simule condições de pagamento.</span>
        </button>
        <button type="button" class="home-card" data-area="relatorios-area" aria-controls="relatorios-area">
          <span class="card-icone card-icone-relatorios" aria-hidden="true"></span>
          <strong>Relatórios</strong><span>Consulte o ranking de inadimplência.</span>
        </button>
      </nav>
      <button id="voltar-inicio" type="button" hidden>← Voltar ao início</button>
      <section id="acordo-area" aria-labelledby="acordo-titulo" tabindex="-1" hidden>
        <h2 id="acordo-titulo">Simular acordo</h2>
        <p id="simulador-carregando" role="status">Consultando captações e cadastro…</p>
        <div id="simulador" hidden>
          <form id="simulacao-form">
            <div class="simulacao-colunas">
              <div class="simulacao-coluna">
                <label for="simulacao-adm">Administradora</label>
                <select id="simulacao-adm" size="8" required disabled></select>
              </div>
              <div class="simulacao-coluna">
                <label for="simulacao-condominio">Condomínio</label>
                <select id="simulacao-condominio" size="8" required disabled><option>Selecione a administradora</option></select>
              </div>
              <div class="simulacao-coluna">
                <label for="simulacao-unidade">Unidade</label>
                <select id="simulacao-unidade" size="8" required disabled><option>Selecione o condomínio</option></select>
              </div>
              <div id="simulacao-cotas" class="simulacao-coluna" role="group" aria-labelledby="simulacao-cotas-titulo">
                <span class="coluna-titulo" id="simulacao-cotas-titulo">Cotas em aberto</span>
                <div class="simulacao-lista-cotas"><p>Selecione a unidade.</p></div>
              </div>
            </div>
            <p id="simulacao-status" role="status" hidden></p>
            <details id="simulacao-editar-cotas" hidden>
              <summary>Editar valores das cotas</summary>
              <div id="simulacao-valores-cotas"></div>
              <p id="simulacao-erro-cotas" class="simulacao-nota" role="alert" hidden></p>
            </details>
            <fieldset id="simulacao-condicoes" disabled>
              <legend>Condições</legend>
              <div class="simulacao-opcoes">
                <label>Despesa de cobrança
                  <select id="simulacao-despesa"><option value="10">10%</option><option value="20">20%</option></select>
                </label>
                <label>Parcelas
                  <select id="simulacao-parcelas"><option value="1">1x à vista</option><option value="2">2x</option><option value="3">3x</option></select>
                </label>
                <label>Primeiro vencimento
                  <input type="date" id="simulacao-primeiro-vencimento" required>
                </label>
                <label id="simulacao-dia-mensal-campo" hidden>Dia das demais parcelas
                  <select id="simulacao-dia-mensal" disabled>
                    <option value="">Mesmo dia do primeiro vencimento</option>
                  </select>
                </label>
                <label id="simulacao-isencao" hidden><input type="checkbox" id="simulacao-isentar-regulares" disabled> Isentar parcela vigente</label>
                <label><input type="checkbox" id="simulacao-juros" disabled> Juros de 1% ao mês (Price)</label>
                <label><input type="checkbox" id="simulacao-boleto"> <span id="simulacao-boleto-texto">Cobrar boleto</span></label>
              </div>
              <p id="simulacao-limite-parcelas" class="simulacao-nota" aria-live="polite" hidden></p>
            </fieldset>
            <button id="simulacao-gerar" type="submit" disabled>Simular acordo</button>
          </form>
          <section id="simulacao-revisao" aria-live="polite"></section>
        </div>
      </section>
      <section id="captacao-area" aria-label="Captação" tabindex="-1" hidden>
        <div id="result" aria-live="polite"></div>
      </section>
      <section id="relatorios-area" aria-label="Relatórios" tabindex="-1" hidden>
        <div id="relatorios"></div>
      </section>
      <section id="cadastro-area" aria-label="Cadastro" tabindex="-1" hidden>
        <div id="catalog"></div>
      </section>
    </section>
    <p id="status-sessao" role="status"></p>
  </main>
  <script type="module">
    import { agruparCotas, calcularSimulacao, dataCivilValida, hojeEmSaoPaulo, lerValorMonetario, localizarCadastro, somarDias, validarParcelasEditadas } from "./simulacao.mjs";
    import { calcularRanking, lerReguaRanking } from "./ranking.mjs";
    const authUrl = "https://jrctpldzavctwaqiepul.supabase.co/auth/v1";
    const apiKey = "sb_publishable_TrF0lI26AdHZ1ksG650lPA_N6JrTYCz";
    const login = document.querySelector("#login");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");
    const enter = document.querySelector("#enter");
    const exit = document.querySelector("#exit");
    const signedIn = document.querySelector("#signed-in");
    const account = document.querySelector("#account");
    const status = document.querySelector("#status");
    const statusSessao = document.querySelector("#status-sessao");
    const result = document.querySelector("#result");
    const catalog = document.querySelector("#catalog");
    const relatorios = document.querySelector("#relatorios");
    const moeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
    const dataCurta = iso => iso.split("-").reverse().join("/");
    const dataHora = new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short", timeZone: "America/Sao_Paulo" });
    let accessToken;

    const inicio = document.querySelector("#inicio");
    const voltarInicio = document.querySelector("#voltar-inicio");
    const cards = [...inicio.querySelectorAll("[data-area]")];
    let cardAtual;

    function mostrarInicio(restaurarFoco = false) {
      if (cardAtual) {
        const area = document.getElementById(cardAtual.dataset.area);
        area.hidden = true;
        if (area.id === "cadastro-area") {
          area.querySelectorAll(".catalog-ficha").forEach(ficha => ficha.dispatchEvent(new Event("ocultar-acesso")));
        }
      }
      inicio.hidden = false;
      voltarInicio.hidden = true;
      if (restaurarFoco) cardAtual?.focus();
      cardAtual = undefined;
    }

    for (const card of cards) {
      card.addEventListener("click", () => {
        const area = document.getElementById(card.dataset.area);
        cardAtual = card;
        inicio.hidden = true;
        voltarInicio.hidden = false;
        area.hidden = false;
        area.focus();
      });
    }

    voltarInicio.addEventListener("click", () => mostrarInicio(true));

    function listar(destino, titulo, linhas) {
      const detalhes = document.createElement("details");
      const rotulo = document.createElement("summary");
      rotulo.textContent = titulo + " (" + linhas.length + ")";
      detalhes.append(rotulo);
      if (linhas.length) {
        const lista = document.createElement("ul");
        for (const linha of linhas) {
          const item = document.createElement("li");
          item.textContent = linha;
          lista.append(item);
        }
        detalhes.append(lista);
      }
      destino.append(detalhes);
    }

    const rotulosAcesso = {
      cadastrado: "Acesso cadastrado",
      sem_acesso: "Sem acesso",
      nao_verificado: "Não verificado",
    };

    function montarAcesso(id, acesso, ficha, token) {
      const bloco = document.createElement("div");
      const situacao = document.createElement("p");
      situacao.textContent = "Acesso ao portal · " + (rotulosAcesso[acesso?.situacao] ?? "Não verificado");
      bloco.append(situacao);

      if (acesso?.administradora) {
        const adm = document.createElement("p");
        adm.textContent = "Administradora na planilha · " + acesso.administradora;
        bloco.append(adm);
      }

      if (acesso?.portal) {
        const portal = document.createElement("p");
        portal.textContent = "Portal · ";
        let url;
        try { url = new URL(acesso.portal); } catch {}
        if (url && ["https:", "http:"].includes(url.protocol) && !url.username && !url.password) {
          const link = document.createElement("a");
          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = url.hostname;
          portal.append(link);
        } else {
          portal.append(acesso.portal);
        }
        bloco.append(portal);
      }

      if (acesso?.situacao === "cadastrado") {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.textContent = "Mostrar dados de acesso";
        const dados = document.createElement("p");
        dados.className = "access-details";
        dados.setAttribute("role", "status");
        let exibindo = false;
        let consulta = 0;
        const ocultar = () => {
          consulta++;
          exibindo = false;
          dados.textContent = "";
          botao.textContent = "Mostrar dados de acesso";
        };
        ficha.addEventListener("ocultar-acesso", ocultar);
        ficha.addEventListener("toggle", () => { if (!ficha.open) ocultar(); });
        botao.addEventListener("click", async () => {
          if (exibindo) {
            ocultar();
            return;
          }
          botao.disabled = true;
          const atual = ++consulta;
          dados.textContent = "Consultando…";
          try {
            const params = new URLSearchParams({ select: "credenciais", condominio_id: "eq." + id });
            const response = await fetch(new URL("/rest/v1/condominio_acessos?" + params, authUrl), {
              headers: { apikey: apiKey, Authorization: "Bearer " + token },
              cache: "no-store",
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error("Consulta indisponível");
            const [registro] = await response.json();
            if (atual !== consulta || token !== accessToken || !ficha.isConnected || !ficha.open || ficha.closest("[hidden]")) {
              ocultar();
              return;
            }
            dados.textContent = registro?.credenciais || "Dados de acesso indisponíveis.";
            exibindo = true;
            botao.textContent = "Ocultar dados de acesso";
          } catch {
            if (atual === consulta && token === accessToken && ficha.isConnected && ficha.open && !ficha.closest("[hidden]")) dados.textContent = "Não foi possível consultar os dados de acesso.";
          } finally {
            botao.disabled = false;
          }
        });
        bloco.append(botao, dados);
      }
      return bloco;
    }

    async function consultarEspelho(token, tabela, filtros) {
      const query = new URLSearchParams(filtros);
      const response = await fetch(new URL("/rest/v1/" + tabela + "?" + query, authUrl), {
        headers: { apikey: apiKey, Authorization: "Bearer " + token },
        cache: "no-store",
        signal: AbortSignal.timeout(15000),
      });
      if (!response.ok) throw new Error("Consulta indisponível");
      return response.json();
    }

    function consultarCaptacao(token, id) {
      return consultarEspelho(token, "captacoes", {
        select: "condominio,administradora,captado_em,dados",
        id: "eq." + id,
        limit: "1",
      });
    }

    function opcoesAdministradoras(administradoras) {
      return administradoras.map(administradora => [administradora.chave, administradora.nome_operacional]);
    }

    function painelAdministradoras(administradoras) {
      const painel = document.createElement("details");
      const titulo = document.createElement("summary");
      titulo.textContent = "Cadastro de administradoras (" + administradoras.length + ")";
      painel.append(titulo);

      const lista = colunaConsulta("administradoras-cadastro", "Administradora");
      const ficha = colunaConsulta("administradoras-ficha", "Ficha da administradora", false);
      const colunas = document.createElement("div");
      colunas.className = "simulacao-colunas colunas-administradoras";
      colunas.append(lista.coluna, ficha.coluna);
      painel.append(colunas);
      opcoesConsulta(lista.corpo, opcoesAdministradoras(administradoras));
      ficha.corpo.textContent = "Selecione uma administradora.";
      lista.corpo.addEventListener("change", () => {
        const administradora = administradoras.find(item => item.chave === lista.corpo.value);
        if (!administradora) return;
        const { nome, nome_operacional, cadastro } = administradora;
        const campos = document.createElement("dl");
        campos.className = "catalog-record";
        for (const [rotulo, valor] of [
          ["Nome", nome], ["Nome operacional", nome_operacional], ["CNPJ", cadastro.cnpj],
          ["Telefone", cadastro.telefone], ["E-mail", cadastro.email], ["Site", cadastro.site],
          ["Status", cadastro.status], ["Responsável interno", cadastro.responsavel_interno],
          ["Acesso para gerar acordo", cadastro.acesso_gerar_acordo], ["Observações", cadastro.observacoes],
        ]) {
          if (valor == null || valor === "") continue;
          const termo = document.createElement("dt");
          termo.textContent = rotulo;
          const detalhe = document.createElement("dd");
          detalhe.textContent = valor;
          campos.append(termo, detalhe);
        }
        ficha.corpo.replaceChildren(campos);
      });
      return painel;
    }

    const simulador = document.querySelector("#simulador");
    const simuladorCarregando = document.querySelector("#simulador-carregando");
    const formulario = document.querySelector("#simulacao-form");
    const admSim = document.querySelector("#simulacao-adm");
    const condominioSim = document.querySelector("#simulacao-condominio");
    const unidadeSim = document.querySelector("#simulacao-unidade");
    const cotasSim = document.querySelector("#simulacao-cotas");
    const condicoesSim = document.querySelector("#simulacao-condicoes");
    const listaCotas = cotasSim.querySelector("div");
    const editorCotasSim = document.querySelector("#simulacao-editar-cotas");
    const valoresCotasSim = document.querySelector("#simulacao-valores-cotas");
    const erroCotasSim = document.querySelector("#simulacao-erro-cotas");
    const despesaSim = document.querySelector("#simulacao-despesa");
    const parcelasSim = document.querySelector("#simulacao-parcelas");
    const primeiroVencimentoSim = document.querySelector("#simulacao-primeiro-vencimento");
    const diaMensalSim = document.querySelector("#simulacao-dia-mensal");
    const campoDiaMensalSim = document.querySelector("#simulacao-dia-mensal-campo");
    const limiteParcelasSim = document.querySelector("#simulacao-limite-parcelas");
    let limiteSemAprovacao = 0;
    const isencaoSim = document.querySelector("#simulacao-isencao");
    const isentarRegularesSim = document.querySelector("#simulacao-isentar-regulares");
    const jurosSim = document.querySelector("#simulacao-juros");
    const boletoSim = document.querySelector("#simulacao-boleto");
    const boletoTexto = document.querySelector("#simulacao-boleto-texto");
    const gerarSim = document.querySelector("#simulacao-gerar");
    const revisaoSim = document.querySelector("#simulacao-revisao");
    const statusSim = document.querySelector("#simulacao-status");
    const formatarCentavos = valor => moeda.format(valor / 100);
    const moedaEditavel = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    for (let dia = 1; dia <= 31; dia++) diaMensalSim.append(new Option(String(dia), String(dia)));

    function atualizarCondicoesSim() {
      const quantidade = Number(parcelasSim.value);
      campoDiaMensalSim.hidden = quantidade === 1;
      diaMensalSim.disabled = quantidade === 1;
      jurosSim.disabled = quantidade === 1;
      limiteParcelasSim.hidden = !limiteSemAprovacao || condicoesSim.disabled;
      if (limiteSemAprovacao) {
        const limite = "Limite sem aprovação do síndico: " + limiteSemAprovacao + " parcela(s).";
        limiteParcelasSim.textContent = quantidade > limiteSemAprovacao
          ? limite + " Esta simulação exige aprovação do síndico."
          : limite;
      }
    }

    function compartilharSimulacao(texto) {
      const area = document.createElement("div");
      area.className = "simulacao-compartilhar";
      const botao = document.createElement("button");
      botao.type = "button";
      botao.textContent = "Copiar texto da administradora";
      const feedback = document.createElement("p");
      feedback.setAttribute("role", "status");
      const detalhes = document.createElement("details");
      const resumo = document.createElement("summary");
      resumo.textContent = "Ver texto para a administradora";
      const campo = document.createElement("textarea");
      campo.readOnly = true;
      campo.rows = 8;
      campo.value = texto;
      campo.setAttribute("aria-label", "Texto para a administradora");
      detalhes.append(resumo, campo);
      botao.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(texto);
          feedback.textContent = "Texto copiado.";
        } catch {
          detalhes.open = true;
          campo.focus();
          campo.select();
          feedback.textContent = "Copie manualmente o texto selecionado.";
        }
      });
      area.append(botao, feedback, detalhes);
      return area;
    }

    function editorParcelas(parcelas, total, aplicar) {
      const editor = document.createElement("details");
      editor.className = "simulacao-editor";
      const titulo = document.createElement("summary");
      titulo.textContent = "Editar parcelas";
      const instrucoes = document.createElement("p");
      instrucoes.textContent = "Ajuste valores e vencimentos mantendo o total de " + formatarCentavos(total) + ".";
      const campos = document.createElement("form");
      const entradas = parcelas.map(({ valor, vencimento }, indice) => {
        const linha = document.createElement("fieldset");
        linha.className = "simulacao-edicao-parcela";
        const legenda = document.createElement("legend");
        legenda.textContent = "Parcela " + (indice + 1);
        const rotuloData = document.createElement("label");
        rotuloData.textContent = "Vencimento";
        const data = document.createElement("input");
        data.type = "date";
        data.required = true;
        data.value = vencimento;
        rotuloData.append(data);
        const rotuloValor = document.createElement("label");
        rotuloValor.textContent = "Valor (R$)";
        const dinheiro = document.createElement("input");
        dinheiro.inputMode = "decimal";
        dinheiro.required = true;
        dinheiro.value = moedaEditavel.format(valor / 100);
        rotuloValor.append(dinheiro);
        linha.append(legenda, rotuloData, rotuloValor);
        campos.append(linha);
        return { data, dinheiro };
      });
      const feedback = document.createElement("p");
      feedback.className = "simulacao-nota";
      feedback.setAttribute("role", "alert");
      feedback.hidden = true;
      const confirmar = document.createElement("button");
      confirmar.type = "submit";
      confirmar.textContent = "Aplicar edição à simulação";
      campos.append(feedback, confirmar);
      campos.addEventListener("submit", evento => {
        evento.preventDefault();
        const alteradas = entradas.map(({ data, dinheiro }) => ({
          vencimento: data.value, valor: lerValorMonetario(dinheiro.value),
        }));
        const erro = validarParcelasEditadas(alteradas, total);
        if (erro) {
          feedback.hidden = false;
          feedback.textContent = erro;
        } else {
          aplicar(alteradas);
        }
      });
      editor.append(titulo, instrucoes, campos);
      return editor;
    }

    function preencherOpcoes(select, itens) {
      select.replaceChildren(...itens.map(([valor, texto]) => new Option(texto, valor)));
      select.disabled = !itens.length;
      if (itens.length) {
        if (select === condominioSim) select.prepend(new Option("Selecione o condomínio", ""));
        select.selectedIndex = -1;
      }
      else {
        const mensagem = select === condominioSim ? "Selecione a administradora"
          : select === unidadeSim ? "Selecione o condomínio" : "Nenhuma administradora";
        select.append(new Option(mensagem, ""));
      }
    }

    function mostrarStatusSim(texto) {
      statusSim.textContent = texto;
      statusSim.hidden = !texto;
    }

    function limparUnidadeSim() {
      condicoesSim.disabled = true;
      atualizarCondicoesSim();
      isencaoSim.hidden = true;
      isentarRegularesSim.disabled = true;
      isentarRegularesSim.checked = false;
      const mensagem = document.createElement("p");
      mensagem.textContent = "Selecione a unidade.";
      listaCotas.replaceChildren(mensagem);
      valoresCotasSim.replaceChildren();
      editorCotasSim.open = false;
      editorCotasSim.hidden = true;
      erroCotasSim.hidden = true;
      revisaoSim.replaceChildren();
      gerarSim.disabled = true;
    }

    function limparSimulador() {
      simulador.hidden = true;
      simuladorCarregando.hidden = false;
      formulario.reset();
      for (const seletor of [admSim, condominioSim, unidadeSim]) preencherOpcoes(seletor, []);
      admSim.onchange = condominioSim.onchange = unidadeSim.onchange = formulario.onsubmit = null;
      mostrarStatusSim("");
      limparUnidadeSim();
    }

    async function prepararSimulador(token, consultaCaptacoes, consultaCadastro, consultaAdministradoras) {
      try {
        const [captacoes, registros, administradoras] = await Promise.all([consultaCaptacoes, consultaCadastro, consultaAdministradoras]);
        if (token !== accessToken) return;
        simuladorCarregando.hidden = true;
        simulador.hidden = false;
        preencherOpcoes(admSim, opcoesAdministradoras(administradoras));
        if (!captacoes.length) mostrarStatusSim("Nenhuma captação disponível para simular.");

        let unidades = new Map();
        let custoBoleto = null;
        let consultaAtual = 0;
        const limparCondominio = () => {
          consultaAtual++;
          unidades = new Map();
          custoBoleto = null;
          limiteSemAprovacao = 0;
          primeiroVencimentoSim.value = "";
          diaMensalSim.value = "";
          boletoSim.checked = false;
          preencherOpcoes(unidadeSim, []);
          mostrarStatusSim("");
          limparUnidadeSim();
        };

        admSim.onchange = () => {
          limparCondominio();
          preencherOpcoes(condominioSim, captacoes.filter(captacao => captacao.administradora_chave === admSim.value)
            .map(captacao => [captacao.codigo_condominio, captacao.condominio]));
          if (condominioSim.disabled) mostrarStatusSim("Nenhuma captação disponível para esta administradora.");
        };

        condominioSim.onchange = async () => {
          limparCondominio();
          const codigo = condominioSim.value;
          const administradora = admSim.value;
          const captacao = captacoes.find(item => item.codigo_condominio === codigo && item.administradora_chave === administradora);
          if (!captacao) return;
          const cadastro = localizarCadastro(captacao, registros);
          if (!cadastro) {
            mostrarStatusSim("O cadastro do condomínio não foi identificado para conferir a régua e o custo de boleto.");
            return;
          }
          const diasRegua = Number(cadastro.dias_apos_vencimento_regua ?? cadastro.inicio_cobranca_dias ?? 30);
          if (!Number.isSafeInteger(diasRegua) || diasRegua < 0) {
            mostrarStatusSim("Confira a régua no cadastro do condomínio.");
            return;
          }
          const limite = Number(cadastro.parcelas_acordo_sem_aprovacao_sindico);
          limiteSemAprovacao = Number.isSafeInteger(limite) && limite > 0 ? limite : 0;
          const custo = Number(cadastro.custo_emissao_boleto);
          custoBoleto = cadastro.custo_emissao_boleto != null && cadastro.custo_emissao_boleto !== ""
            && Number.isFinite(custo) && custo >= 0 ? Math.round(custo * 100) : null;
          boletoSim.disabled = custoBoleto === null;
          boletoTexto.textContent = custoBoleto === null ? "Cobrar boleto (custo indisponível no cadastro)"
            : "Cobrar boleto (" + formatarCentavos(custoBoleto) + " por emissão)";

          const consulta = consultaAtual;
          mostrarStatusSim("Consultando as cotas da última captação…");
          try {
            const [resultado] = await consultarCaptacao(token, captacao.id);
            if (token !== accessToken || consulta !== consultaAtual) return;
            if (!resultado) throw new Error("Captação indisponível");
            unidades = agruparCotas(resultado.dados, hojeEmSaoPaulo(), diasRegua);
            preencherOpcoes(unidadeSim, [...unidades.keys()].map(unidade => [unidade, unidade]));
            const mensagem = unidades.size ? "Cotas captadas em " + dataHora.format(new Date(resultado.captado_em)) + "."
              : "Nenhuma unidade com cotas abertas dentro da régua nesta captação.";
            mostrarStatusSim(mensagem);
          } catch {
            if (token === accessToken && consulta === consultaAtual) mostrarStatusSim("Não foi possível carregar as cotas. Selecione o condomínio novamente.");
          }
        };

        unidadeSim.onchange = () => {
          limparUnidadeSim();
          const cotas = unidades.get(unidadeSim.value) ?? [];
          if (cotas.length) listaCotas.replaceChildren();
          cotas.forEach((cota, indice) => {
            const caixa = document.createElement("input");
            caixa.type = "checkbox";
            caixa.value = String(indice);
            caixa.checked = !cota.regular;
            caixa.toggleAttribute("data-regular", cota.regular);
            const rotulo = document.createElement("label");
            rotulo.append(caixa, [
              "Recibo " + cota.recibo, dataCurta(cota.vencimento),
              cota.regular ? "Regular" : "Dentro da régua", formatarCentavos(cota.valor),
            ].join(" · "));
            listaCotas.append(rotulo);

            const campoValor = document.createElement("label");
            const identificacao = "Recibo " + cota.recibo + " · " + dataCurta(cota.vencimento);
            campoValor.textContent = identificacao;
            const original = document.createElement("small");
            original.textContent = "Valor captado: " + formatarCentavos(cota.valor);
            const valor = document.createElement("input");
            valor.inputMode = "decimal";
            valor.setAttribute("aria-label", "Valor da cota " + identificacao);
            valor.value = moedaEditavel.format(cota.valor / 100);
            campoValor.append(valor, original);
            valoresCotasSim.append(campoValor);
          });
          condicoesSim.disabled = !cotas.length;
          if (cotas.length && !primeiroVencimentoSim.value) primeiroVencimentoSim.value = somarDias(hojeEmSaoPaulo(), 7);
          atualizarCondicoesSim();
          atualizarEditorCotas();
          gerarSim.disabled = !cotas.length;
        };

        formulario.onsubmit = evento => {
          evento.preventDefault();
          const cotas = unidades.get(unidadeSim.value) ?? [];
          const marcadas = [...listaCotas.querySelectorAll("input:checked")];
          if (!marcadas.length || !dataCivilValida(primeiroVencimentoSim.value)) return;
          const entradas = marcadas.map(caixa => valoresCotasSim.children[Number(caixa.value)].querySelector("input"));
          const escolhidas = marcadas.map((caixa, i) => ({
            ...cotas[Number(caixa.value)], valor: lerValorMonetario(entradas[i].value),
          }));
          const invalida = escolhidas.findIndex(cota => cota.valor === null);
          if (invalida !== -1) {
            editorCotasSim.open = true;
            erroCotasSim.textContent = "Informe um valor positivo e válido para cada cota selecionada.";
            erroCotasSim.hidden = false;
            entradas[invalida].focus();
            return;
          }
          const quantidade = Number(parcelasSim.value);
          const percentual = Number(despesaSim.value);
          const previa = calcularSimulacao({
            cotas: escolhidas, percentual, quantidade, price: jurosSim.checked,
            isentarRegulares: isentarRegularesSim.checked,
            boleto: boletoSim.checked ? custoBoleto ?? 0 : 0,
            primeiroVencimento: primeiroVencimentoSim.value,
            diaMensal: quantidade > 1 && diaMensalSim.value ? Number(diaMensalSim.value) : undefined,
          });
          const avisoAprovacao = limiteSemAprovacao && quantidade > limiteSemAprovacao
            ? "Esta simulação exige aprovação do síndico. O cadastro permite até " + limiteSemAprovacao + " parcela(s) sem aprovação."
            : "";
          function renderizar(parcelas) {
            const titulo = document.createElement("h2");
            titulo.textContent = "Confira a simulação";
            titulo.tabIndex = -1;
            const valores = document.createElement("dl");
            valores.className = "catalog-record";
            const resumo = [
              ["Cotas selecionadas", previa.base],
              ...(previa.baseIsenta ? [["Cotas regulares isentas de despesa", previa.baseIsenta]] : []),
              ["Despesa de cobrança (" + percentual + "%)", previa.despesa],
              ["Juros do parcelamento", previa.juros], ["Emissão de boletos", previa.boletos], ["Total", previa.total],
            ];
            for (const [nome, valor] of resumo) {
              const termo = document.createElement("dt");
              const detalhe = document.createElement("dd");
              termo.textContent = nome;
              detalhe.textContent = formatarCentavos(valor);
              valores.append(termo, detalhe);
            }
            const plano = document.createElement("ol");
            const linhasParcelas = parcelas.map(parcela =>
              dataCurta(parcela.vencimento) + " · " + formatarCentavos(parcela.valor));
            for (const parcela of linhasParcelas) {
              const item = document.createElement("li");
              item.textContent = parcela;
              plano.append(item);
            }
            const texto = [
              "Prezados, segue a simulação do acordo para conferência.",
              "",
              "Administradora: " + admSim.selectedOptions[0].textContent,
              "Condomínio: " + condominioSim.selectedOptions[0].textContent,
              "Unidade: " + unidadeSim.value,
              "",
              "Cotas selecionadas:",
              ...escolhidas.map(cota => [
                "Recibo " + cota.recibo, dataCurta(cota.vencimento), formatarCentavos(cota.valor),
                cota.regular && previa.baseIsenta ? "Sem despesa de cobrança" : null,
              ].filter(Boolean).join(" · ")),
              "",
              ...resumo.map(([nome, valor]) => nome + ": " + formatarCentavos(valor)),
              ...(avisoAprovacao ? [avisoAprovacao] : []),
              "",
              "Plano de pagamento:",
              ...linhasParcelas.map((parcela, indice) => "Parcela " + (indice + 1) + " · " + parcela),
            ].join("\n");
            const editar = editorParcelas(parcelas, previa.total, alteradas => {
              renderizar(alteradas);
              revisaoSim.querySelector("h2").focus();
            });
            revisaoSim.replaceChildren(titulo, valores);
            if (avisoAprovacao) {
              const aviso = document.createElement("p");
              aviso.className = "simulacao-nota";
              aviso.textContent = avisoAprovacao;
              revisaoSim.append(aviso);
            }
            const editarCotas = document.createElement("button");
            editarCotas.type = "button";
            editarCotas.className = "simulacao-editar-condicoes";
            editarCotas.textContent = "Editar cotas e condições";
            editarCotas.addEventListener("click", () => {
              editorCotasSim.open = true;
              valoresCotasSim.querySelector("label:not([hidden]) input")?.focus();
            });
            revisaoSim.append(plano, editarCotas, editar, compartilharSimulacao(texto));
          }
          renderizar(previa.parcelas);
        };
      } catch {
        if (token !== accessToken) return;
        simuladorCarregando.hidden = true;
        simulador.hidden = false;
        mostrarStatusSim("Não foi possível carregar as captações e o cadastro para simular.");
      }
    }

    function atualizarEditorCotas() {
      const caixas = [...listaCotas.querySelectorAll("input")];
      [...valoresCotasSim.children].forEach((campo, indice) => {
        campo.hidden = !caixas[indice].checked;
        campo.querySelector("input").disabled = campo.hidden;
      });
      editorCotasSim.hidden = !caixas.some(caixa => caixa.checked);
      erroCotasSim.hidden = true;
    }

    valoresCotasSim.addEventListener("input", () => {
      revisaoSim.replaceChildren();
      erroCotasSim.hidden = true;
    });

    formulario.addEventListener("change", () => {
      revisaoSim.replaceChildren();
      atualizarCondicoesSim();
      atualizarEditorCotas();
      const regularSelecionada = Boolean(listaCotas.querySelector("input[data-regular]:checked"));
      isencaoSim.hidden = !regularSelecionada;
      isentarRegularesSim.disabled = !regularSelecionada;
      if (!regularSelecionada) isentarRegularesSim.checked = false;
      gerarSim.disabled = !listaCotas.querySelector("input:checked");
    });

    function colunaConsulta(id, titulo, lista = true) {
      const coluna = document.createElement("div");
      coluna.className = "simulacao-coluna";
      const rotulo = document.createElement(lista ? "label" : "span");
      rotulo.textContent = titulo;
      const corpo = document.createElement(lista ? "select" : "div");
      if (lista) {
        rotulo.htmlFor = id;
        corpo.id = id;
        corpo.size = 8;
      } else {
        rotulo.id = id;
        rotulo.className = "coluna-titulo";
        corpo.className = "simulacao-lista-cotas coluna-detalhes";
        coluna.setAttribute("role", "group");
        coluna.setAttribute("aria-labelledby", id);
      }
      coluna.append(rotulo, corpo);
      return { coluna, corpo };
    }

    function opcoesConsulta(lista, itens, vazio = "Nenhum resultado") {
      lista.replaceChildren(...itens.map(([valor, texto]) => new Option(texto, valor)));
      lista.disabled = !itens.length;
      if (itens.length) lista.selectedIndex = -1;
      else lista.append(new Option(vazio, ""));
    }

    function montarColunas(destino, titulo, classe, partes, antes = []) {
      const cabecalho = document.createElement("h2");
      cabecalho.textContent = titulo;
      const grade = document.createElement("div");
      grade.className = "simulacao-colunas " + classe;
      grade.append(...partes.map(parte => parte.coluna));
      destino.replaceChildren(cabecalho, ...antes, grade);
    }

    function fichaCondominio({ id, nome, status, cadastro, condominio_acessos: acesso }, token) {
      const ficha = document.createElement("details");
      ficha.open = true;
      ficha.className = "catalog-ficha";
      const resumo = document.createElement("summary");
      resumo.textContent = [nome, status].filter(Boolean).join(" · ");
      const campos = document.createElement("dl");
      campos.className = "catalog-record";
      const principais = ["nome", "nome_operacional", "cnpj", "administradora", "status"];
      const chaves = [...principais, ...Object.keys(cadastro).filter(chave => !principais.includes(chave)).sort()];
      for (const chave of chaves) {
        const termo = document.createElement("dt");
        termo.textContent = chave === "cnpj" ? "CNPJ" : chave.replaceAll("_", " ");
        const valor = document.createElement("dd");
        valor.textContent = cadastro[chave] == null || cadastro[chave] === "" ? "—" : cadastro[chave];
        campos.append(termo, valor);
      }
      ficha.append(resumo, montarAcesso(id, acesso, ficha, token), campos);
      return ficha;
    }

    async function mostrarCadastro(token, consulta, consultaAdministradoras) {
      catalog.textContent = "Consultando o cadastro de condomínios…";
      try {
        const [registros, administradoras] = await Promise.all([consulta, consultaAdministradoras]);
        if (token !== accessToken) return;
        const adm = colunaConsulta("catalog-adm", "Administradora");
        const condominio = colunaConsulta("catalog-condominio", "Condomínio");
        const ficha = colunaConsulta("catalog-ficha", "Ficha do condomínio", false);
        const rotulo = document.createElement("label");
        rotulo.htmlFor = "catalog-filter";
        rotulo.textContent = "Buscar por nome, CNPJ, administradora ou status";
        const filtro = document.createElement("input");
        filtro.type = "search";
        filtro.id = "catalog-filter";
        const contagem = document.createElement("p");
        contagem.setAttribute("role", "status");
        montarColunas(catalog, "Cadastro de condomínios", "colunas-cadastro", [adm, condominio, ficha], [painelAdministradoras(administradoras), rotulo, filtro, contagem]);

        const normalizar = texto => texto.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim();
        const nomeAdministradora = new Map(opcoesAdministradoras(administradoras));
        const porId = new Map(registros.map(registro => [registro.id, registro]));
        opcoesConsulta(adm.corpo, [
          ["todos", "Todas as administradoras"],
          ...opcoesAdministradoras(administradoras).map(([chave, nome]) => ["adm:" + chave, nome]),
          ...(registros.some(registro => !registro.administradora_chave) ? [["sem", "Sem administradora"]] : []),
        ]);
        adm.corpo.value = "todos";

        function filtrarCadastro() {
          const busca = normalizar(filtro.value);
          const selecionado = condominio.corpo.value;
          const filtrados = registros.filter(registro => {
            const chave = registro.administradora_chave;
            if (adm.corpo.value !== "todos" && adm.corpo.value !== (chave ? "adm:" + chave : "sem")) return false;
            const { nome, status, cadastro } = registro;
            if (["ativo", "inativo"].includes(busca)) return normalizar(status ?? "") === busca;
            const cnpj = String(cadastro.cnpj ?? "");
            return normalizar([nome, cadastro.nome_operacional, nomeAdministradora.get(chave) ?? "Sem administradora", registro.administradora, cnpj, cnpj.replace(/\D/g, ""), status].join(" ")).includes(busca);
          });
          opcoesConsulta(condominio.corpo, filtrados.map(registro => [registro.id, registro.nome]));
          if (selecionado && filtrados.some(registro => registro.id === selecionado)) {
            condominio.corpo.value = selecionado;
          } else {
            ficha.corpo.textContent = "Selecione o condomínio.";
          }
          contagem.textContent = filtrados.length + " de " + registros.length + " condomínios";
        }

        condominio.corpo.addEventListener("change", () => {
          const registro = porId.get(condominio.corpo.value);
          if (registro) ficha.corpo.replaceChildren(fichaCondominio(registro, token));
        });
        adm.corpo.addEventListener("change", filtrarCadastro);
        filtro.addEventListener("input", filtrarCadastro);
        filtrarCadastro();
      } catch {
        if (token === accessToken) catalog.textContent = "Não foi possível consultar o cadastro.";
      }
    }

    async function mostrarSelecaoCaptacao(token, consulta, consultaAdministradoras) {
      result.textContent = "Consultando captações…";
      try {
        const [captacoes, administradoras] = await Promise.all([consulta, consultaAdministradoras]);
        if (token !== accessToken) return;
        const adm = colunaConsulta("captacao-adm", "Administradora");
        const condominio = colunaConsulta("capture-select", "Condomínio");
        const unidade = colunaConsulta("captacao-unidade", "Unidade");
        const detalhes = colunaConsulta("captacao-detalhes", "Dados captados", false);
        const status = document.createElement("div");
        status.setAttribute("role", "status");
        montarColunas(result, "Captações por condomínio", "colunas-captacao", [adm, condominio, unidade, detalhes], [status]);
        opcoesConsulta(adm.corpo, opcoesAdministradoras(administradoras));
        let pedido = 0;
        let dados;
        const limpar = () => {
          dados = undefined;
          opcoesConsulta(unidade.corpo, [], "Selecione o condomínio");
          detalhes.corpo.textContent = "Selecione o condomínio para consultar a captação.";
          status.replaceChildren();
        };
        adm.corpo.addEventListener("change", () => {
          pedido++;
          limpar();
          opcoesConsulta(condominio.corpo, captacoes.filter(item => item.administradora_chave === adm.corpo.value)
            .map(item => [String(item.id), item.condominio]), "Nenhuma captação disponível");
        });
        condominio.corpo.addEventListener("change", async () => {
          limpar();
          const atual = ++pedido;
          const codigo = condominio.corpo.value;
          if (!codigo) return;
          status.textContent = "Consultando a captação…";
          try {
            const [captacao] = await consultarCaptacao(token, codigo);
            if (token !== accessToken || atual !== pedido) return;
            if (!captacao) {
              status.textContent = "Nenhuma captação disponível para este condomínio.";
              return;
            }
            dados = captacao.dados;
            const unidadeIds = [...new Set([
              ...dados.unidades, ...dados.cotas.map(cota => cota.unidade),
              ...dados.acordos.map(acordo => acordo.unidade), ...dados.contatos.map(contato => contato.unidade),
            ].filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }));
            opcoesConsulta(unidade.corpo, [["todas", "Todas as unidades"], ...unidadeIds.map(id => ["unidade:" + id, id])]);
            unidade.corpo.value = "todas";
            const resumo = document.createElement("p");
            resumo.textContent = [
              "Captado em " + dataHora.format(new Date(captacao.captado_em)),
              dados.acordosCaptadosEm ? "Acordos captados em " + dataHora.format(new Date(dados.acordosCaptadosEm)) : null,
            ].filter(Boolean).join(" · ");
            status.replaceChildren(resumo);
            if (dados.cobertura) {
              const cobertura = document.createElement("p");
              cobertura.textContent = dados.cobertura;
              status.append(cobertura);
            }
            mostrarListasCaptacao(dados, unidade.corpo.value, detalhes.corpo);
          } catch {
            if (token === accessToken && atual === pedido) {
              status.textContent = "Não foi possível consultar a captação.";
              condominio.corpo.selectedIndex = -1;
            }
          }
        });
        unidade.corpo.addEventListener("change", () => mostrarListasCaptacao(dados, unidade.corpo.value, detalhes.corpo));
        opcoesConsulta(condominio.corpo, [], "Selecione a administradora");
        limpar();
      } catch {
        if (token === accessToken) result.textContent = "Não foi possível consultar as captações.";
      }
    }

    function mostrarListasCaptacao(dados, selecao, listas) {
      const corresponde = unidade => selecao === "todas" || "unidade:" + unidade === selecao;
      listas.replaceChildren();
      if (!dados.cobertura || dados.contatos.length) listar(listas, "Responsáveis encontrados", dados.contatos.filter(c => corresponde(c.unidade)).map(c =>
        [c.unidade, c.nome, c.email].filter(Boolean).join(" · ")
      ));
      const tituloCotas = dados.cotasEmAcordoNoRelatorio ? "Recibos no relatório de devedores" : "Cotas em aberto";
      const situacoesAcordos = new Map(dados.acordos.map(a => [a.numero, a.situacao]));
      listar(listas, tituloCotas, dados.cotas.filter(c => corresponde(c.unidade)).map(c => [
        c.unidade, "Recibo " + c.recibo, c.vencimento, moeda.format(c.valores.at(-1) / 100),
        c.acordoOrigem ? "Acordo " + c.acordoOrigem : null, situacoesAcordos.get(c.acordoOrigem),
      ].filter(Boolean).join(" · ")));
      if (!dados.cobertura || dados.acordosCaptadosEm) listar(listas, "Acordos", dados.acordos.filter(a => corresponde(a.unidade)).map(a => [
        a.unidade, "Acordo " + a.numero, a.situacao, a.total == null ? null : moeda.format(a.total / 100),
        a.parcelas ? a.parcelas.length + " parcelas" : null, a.cotas ? a.cotas.length + " cotas vinculadas" : null,
        a.saldo == null ? null : "Saldo " + moeda.format(a.saldo / 100),
        a.periodoNegociado ? "Período negociado " + dataCurta(a.periodoNegociado.inicio) + " a " + dataCurta(a.periodoNegociado.fim) : null,
        a.cotasAbertasNoPeriodo?.length ? "Recibos em aberto no período (a conferir) " + a.cotasAbertasNoPeriodo.map(cota => cota.recibo).join(", ") : null,
      ].filter(Boolean).join(" · ")));
    }

    function tabelaRanking(rotulos, linhas) {
      const tabela = document.createElement("table");
      tabela.className = "tabela-ranking";
      const cabecalho = tabela.createTHead().insertRow();
      for (const rotulo of rotulos) {
        const celula = document.createElement("th");
        celula.scope = "col";
        celula.textContent = rotulo;
        cabecalho.append(celula);
      }
      const corpo = tabela.createTBody();
      for (const valores of linhas) {
        const linha = corpo.insertRow();
        for (const valor of valores) linha.insertCell().textContent = valor;
      }
      const quadro = document.createElement("div");
      quadro.className = "ranking-tabela";
      quadro.append(tabela);
      return quadro;
    }

    function exibirRanking(destino, captura, regua, administradora) {
      const ranking = calcularRanking(captura, regua);
      const documento = document.createElement("article");
      documento.className = "ranking-document";
      function texto(elemento, tag, conteudo, classe) {
        const item = document.createElement(tag);
        if (classe) item.className = classe;
        item.textContent = conteudo;
        elemento.append(item);
        return item;
      }
      const capa = document.createElement("header");
      capa.className = "ranking-capa";
      const marca = document.createElement("img");
      marca.src = "./assets/gkli-marca.webp";
      marca.alt = "GKLI — Cobrança inteligente";
      marca.width = 126;
      capa.append(marca);
      texto(capa, "h2", "Ranking de inadimplência");
      texto(capa, "p", captura.condominio, "ranking-condominio");
      texto(capa, "p", administradora + " · Captação de " + dataHora.format(new Date(captura.captado_em)));
      documento.append(capa);

      const indicadores = document.createElement("dl");
      indicadores.className = "ranking-indicadores";
      for (const [rotulo, valor] of [
        ["Saldo das cotas abertas", formatarCentavos(ranking.saldo)],
        ["Unidades distintas", ranking.unidades],
        ["Cotas abertas", ranking.quantidade],
      ]) {
        const card = document.createElement("div");
        texto(card, "dt", rotulo);
        texto(card, "dd", valor);
        indicadores.append(card);
      }
      documento.append(indicadores);
      texto(documento, "p", "Faixas calculadas por vencimento na data da captação. A mesma unidade pode aparecer em faixas diferentes. A etapa operacional depende dos registros da cobrança.", "ranking-nota");

      for (const faixa of ranking.blocos) {
        const secao = document.createElement("section");
        secao.className = "ranking-secao";
        secao.classList.toggle("ranking-secao-curta", faixa.linhas.length <= 6);
        texto(secao, "h3", faixa.nome);
        texto(secao, "p", [faixa.criterio, faixa.quantidade + " cotas", faixa.linhas.length + " unidades", formatarCentavos(faixa.saldo)].join(" · "));
        if (faixa.linhas.length) secao.append(tabelaRanking(["Pos.", "Unidade", "Cotas", "1º venc.", "Últ. venc.", "Saldo em aberto"],
          faixa.linhas.map((linha, indice) => [indice + 1, linha.unidade, linha.quantidade, dataCurta(linha.primeiro), dataCurta(linha.ultimo), formatarCentavos(linha.saldo)])));
        documento.append(secao);
      }

      const acordos = document.createElement("section");
      acordos.className = "ranking-secao";
      acordos.classList.toggle("ranking-secao-curta", ranking.acordos.length <= 6);
      texto(acordos, "h3", "Acordos em andamento");
      if (ranking.acordos.length) {
        texto(acordos, "p", ranking.acordos.length + " acordo(s) · Saldo informado " + formatarCentavos(ranking.saldoAcordos));
        acordos.append(tabelaRanking(["Unidade", "Nº do acordo", "Recibos vinculados", "Saldo do acordo"],
          ranking.acordos.map(acordo => [acordo.unidade, String(acordo.numero) + (acordo.judicial ? " · Judicial" : ""),
            acordo.recibos.size, acordo.saldo == null ? "Não informado" : formatarCentavos(acordo.saldo)])));
      } else {
        texto(acordos, "p", "Nenhum acordo em andamento identificado na captação.");
      }
      documento.append(acordos);

      const conferencia = document.createElement("section");
      conferencia.className = "ranking-secao ranking-secao-curta";
      texto(conferencia, "h3", "Conferência da captação");
      if (Number.isSafeInteger(ranking.saldoBruto)) texto(conferencia, "p", "Saldo bruto informado pela administradora: " + formatarCentavos(ranking.saldoBruto));
      texto(conferencia, "p", "Recibos de acordo retirados do ranking: " + ranking.excluidas + " · " + formatarCentavos(ranking.saldoExcluido));
      if (Number.isSafeInteger(ranking.saldoFonte)) texto(conferencia, "p", "Saldo de cotas abertas na fonte: " + formatarCentavos(ranking.saldoFonte));
      texto(conferencia, "p", "Saldo de cotas do ranking: " + formatarCentavos(ranking.saldo));
      if (captura.dados.cobertura) texto(conferencia, "p", captura.dados.cobertura, "ranking-nota");
      for (const aviso of ranking.avisos) texto(conferencia, "p", aviso, "ranking-aviso");
      documento.append(conferencia);

      const imprimir = document.createElement("button");
      imprimir.type = "button";
      imprimir.className = "ranking-imprimir";
      imprimir.textContent = "Imprimir / salvar PDF";
      imprimir.addEventListener("click", () => {
        const tituloAnterior = document.title;
        document.title = "Ranking - " + captura.condominio + " - " + ranking.posicao.slice(0, 7);
        try { window.print(); } finally { document.title = tituloAnterior; }
      });
      destino.replaceChildren(imprimir, documento);
    }

    async function mostrarRelatorios(token, consultaCaptacoes, consultaAdministradoras, consultaCadastro) {
      relatorios.textContent = "Consultando captações…";
      try {
        const [captacoes, administradoras, cadastro] = await Promise.all([consultaCaptacoes, consultaAdministradoras, consultaCadastro]);
        if (token !== accessToken) return;
        const relatorio = colunaConsulta("relatorio-tipo", "Relatório");
        const adm = colunaConsulta("relatorio-adm", "Administradora");
        const condominio = colunaConsulta("relatorio-condominio", "Condomínio");
        const conteudo = document.createElement("div");
        conteudo.className = "relatorio-conteudo";
        conteudo.setAttribute("aria-live", "polite");
        montarColunas(relatorios, "Relatórios", "colunas-relatorios", [relatorio, adm, condominio]);
        relatorios.append(conteudo);
        opcoesConsulta(relatorio.corpo, [["ranking", "Ranking de inadimplência"]]);
        opcoesConsulta(adm.corpo, [], "Selecione o relatório");
        opcoesConsulta(condominio.corpo, [], "Selecione a administradora");
        let pedido = 0;

        relatorio.corpo.addEventListener("change", () => {
          pedido++;
          opcoesConsulta(adm.corpo, opcoesAdministradoras(administradoras));
          opcoesConsulta(condominio.corpo, [], "Selecione a administradora");
          conteudo.replaceChildren();
        });
        adm.corpo.addEventListener("change", () => {
          pedido++;
          conteudo.replaceChildren();
          opcoesConsulta(condominio.corpo, captacoes.filter(captura => captura.administradora_chave === adm.corpo.value)
            .map(captura => [String(captura.id), captura.condominio]), "Nenhuma captação disponível");
        });
        condominio.corpo.addEventListener("change", async () => {
          const atual = ++pedido;
          conteudo.textContent = "Consultando o ranking…";
          try {
            const [captura] = await consultarCaptacao(token, condominio.corpo.value);
            if (token !== accessToken || atual !== pedido) return;
            if (!captura) {
              conteudo.textContent = "Captação indisponível.";
              return;
            }
            const referencia = captacoes.find(item => String(item.id) === condominio.corpo.value);
            const regua = lerReguaRanking(localizarCadastro(referencia ?? captura, cadastro));
            if (!regua) {
              conteudo.textContent = "A régua deste condomínio não foi identificada no cadastro. Confira os prazos antes de gerar o ranking.";
              return;
            }
            exibirRanking(conteudo, captura, regua, adm.corpo.selectedOptions[0].textContent);
          } catch {
            if (token !== accessToken || atual !== pedido) return;
            conteudo.textContent = "Não foi possível carregar o ranking. Selecione o condomínio novamente.";
            condominio.corpo.selectedIndex = -1;
          }
        });
      } catch {
        if (token === accessToken) relatorios.textContent = "Não foi possível carregar os relatórios.";
      }
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      enter.disabled = true;
      status.textContent = "";
      try {
        const response = await fetch(authUrl + "/token?grant_type=password", {
          method: "POST",
          headers: { apikey: apiKey, "Content-Type": "application/json" },
          body: JSON.stringify({ email: email.value.trim(), password: password.value }),
          signal: AbortSignal.timeout(15000),
        });
        if (!response.ok) {
          status.textContent = response.status === 429
            ? "Muitas tentativas. Aguarde um pouco e tente novamente."
            : response.status === 400
              ? "Confira o e-mail e a senha. A conta precisa estar confirmada."
              : "O login está indisponível. Tente novamente.";
          return;
        }
        const session = await response.json();
        accessToken = session.access_token;
        statusSessao.textContent = "";
        account.textContent = "Sessão iniciada como " + session.user.email + ".";
        login.hidden = true;
        signedIn.hidden = false;
        exit.focus();
        const administradoras = consultarEspelho(accessToken, "administradoras", {
          select: "chave,nome,nome_operacional,cadastro", order: "nome_operacional.asc,chave.asc",
        });
        const captacoes = consultarEspelho(accessToken, "captacoes_por_administradora", {
          select: "id,codigo_condominio,condominio,administradora,administradora_chave",
          order: "condominio.asc,codigo_condominio.asc,id.asc",
        });
        const cadastro = consultarEspelho(accessToken, "condominios", {
          select: "id,nome,administradora,administradora_chave,status,cadastro,condominio_acessos(situacao,administradora,portal)", order: "nome.asc,id.asc",
        });
        void mostrarSelecaoCaptacao(accessToken, captacoes, administradoras);
        void mostrarCadastro(accessToken, cadastro, administradoras);
        void mostrarRelatorios(accessToken, captacoes, administradoras, cadastro);
        void prepararSimulador(accessToken, captacoes, cadastro, administradoras);
      } catch {
        status.textContent = "Não foi possível conectar. Tente novamente.";
      } finally {
        password.value = "";
        enter.disabled = false;
      }
    });

    exit.addEventListener("click", async () => {
      exit.disabled = true;
      statusSessao.textContent = "";
      try {
        const response = await fetch(authUrl + "/logout?scope=local", {
          method: "POST",
          headers: { apikey: apiKey, Authorization: "Bearer " + accessToken },
          signal: AbortSignal.timeout(10000),
        });
        if (!response.ok && response.status !== 401) {
          throw new Error("Logout failed");
        }
      } catch {
        statusSessao.textContent = "Sessão encerrada nesta página. O servidor não confirmou a saída.";
      } finally {
        accessToken = undefined;
        account.textContent = "";
        result.textContent = "";
        limparSimulador();
        catalog.textContent = "";
        relatorios.textContent = "";
        signedIn.hidden = true;
        mostrarInicio();
        login.hidden = false;
        exit.disabled = false;
        email.focus();
      }
    });

    enter.disabled = false;
  </script>
</body>
</html>
